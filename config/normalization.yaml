# Normalization dictionary: abbreviations and spelling variants.
# Grown from the data, never from guesses. After each normalize run, check
# reports/unknown_tokens.txt for the 400 most frequent tokens and add
# spelling groups here.
abbreviations:
  plz: please
  pls: please
  frzr: freezer
  frz: freezer
  mgr: manager
  cust: customer
  bcoz: because
  cuz: because
  thx: thanks
  tmrw: tomorrow
  tdy: today
  yday: yesterday
  aftr: after
  evng: evening
  mrng: morning
  amt: amount
  qty: quantity
  ppl: people
